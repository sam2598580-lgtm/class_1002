<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Hello World</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <div class="absolute -top-20 -left-20 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse"></div>
    <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse" style="animation-delay: 2s;"></div>

    <main class="relative z-10 w-full max-w-md">
        <div class="floating-card bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-white/20 dark:border-slate-700/50 shadow-2xl rounded-3xl p-8 text-center transition-all duration-300">
            
            <!-- Icon/Badge -->
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-indigo-500 to-pink-500 text-white rounded-2xl shadow-lg mb-6 transform hover:rotate-6 transition-transform duration-300">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                </svg>
            </div>

            <!-- Headings -->
            <h1 id="greeting" class="text-4xl font-extrabold text-slate-800 dark:text-white tracking-tight mb-2" aria-live="polite">
                Hello, World! ✨
            </h1>
            <p id="languageLabel" class="text-indigo-600 dark:text-indigo-400 text-sm font-semibold mb-3">English</p>
            <p class="text-slate-500 dark:text-slate-400 text-sm mb-6 leading-relaxed">
                歡迎來到您的現代化網頁首頁。選擇一種語言，看看不同語言的「世界，你好！」吧！
            </p>

            <label for="languageSelect" class="block text-left text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">選擇語言</label>
            <select id="languageSelect" class="w-full mb-6 py-3 px-4 bg-white/80 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="en">English</option>
                <option value="zh-Hant">繁體中文</option>
                <option value="zh-Hans">简体中文</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
            </select>

            <!-- Interactive Buttons -->
            <div class="space-y-3">
                <button id="actionBtn" class="w-full py-3.5 px-6 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-500/30 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">
                    點擊互動
                </button>
                <button id="resetBtn" class="hidden w-full py-3 px-6 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium rounded-xl transition-all duration-200 text-sm">
                    重設狀態
                </button>
            </div>

            <!-- Status message container -->
            <div id="messageBox" class="mt-6 text-xs text-slate-400 dark:text-slate-500 font-medium transition-opacity duration-300">
                準備就緒，隨時可以探索。
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const actionBtn = document.getElementById('actionBtn');
            const resetBtn = document.getElementById('resetBtn');
            const messageBox = document.getElementById('messageBox');
            const greeting = document.getElementById('greeting');
            const languageLabel = document.getElementById('languageLabel');
            const languageSelect = document.getElementById('languageSelect');

            const greetings = {
                en: { text: 'Hello, World!', name: 'English', direction: 'ltr' },
                'zh-Hant': { text: '世界，你好！', name: '繁體中文', direction: 'ltr' },
                'zh-Hans': { text: '世界，你好！', name: '简体中文', direction: 'ltr' },
                ja: { text: 'こんにちは、世界！', name: '日本語', direction: 'ltr' },
                ko: { text: '안녕, 세상아!', name: '한국어', direction: 'ltr' },
                es: { text: '¡Hola, mundo!', name: 'Español', direction: 'ltr' },
                fr: { text: 'Bonjour le monde !', name: 'Français', direction: 'ltr' },
                de: { text: 'Hallo, Welt!', name: 'Deutsch', direction: 'ltr' },
                it: { text: 'Ciao, mondo!', name: 'Italiano', direction: 'ltr' },
                pt: { text: 'Olá, mundo!', name: 'Português', direction: 'ltr' },
                ru: { text: 'Привет, мир!', name: 'Русский', direction: 'ltr' },
                ar: { text: 'مرحباً بالعالم!', name: 'العربية', direction: 'rtl' },
                hi: { text: 'नमस्ते, दुनिया!', name: 'हिन्दी', direction: 'ltr' }
            };

            const messages = [
                "🚀 歡迎解鎖新世界！",
                "💡 程式碼改變未來。",
                "✨ 祝你有美好的一天！",
                "🎉 Hello World 萬歲！"
            ];

            let clickCount = 0;

            languageSelect.addEventListener('change', () => {
                const selectedGreeting = greetings[languageSelect.value];
                greeting.textContent = `${selectedGreeting.text} ✨`;
                greeting.lang = languageSelect.value;
                greeting.dir = selectedGreeting.direction;
                languageLabel.textContent = selectedGreeting.name;
            });

            actionBtn.addEventListener('click', () => {
                clickCount++;
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                messageBox.textContent = `${randomMsg} (已互動 ${clickCount} 次)`;
                messageBox.classList.remove('text-slate-400');
                messageBox.classList.add('text-indigo-600', 'dark:text-indigo-400', 'font-semibold');
                
                // Show reset button after first click
                if (clickCount === 1) {
                    resetBtn.classList.remove('hidden');
                }

                // Button pulse effect
                actionBtn.classList.add('scale-95');
                setTimeout(() => actionBtn.classList.remove('scale-95'), 150);
            });

            resetBtn.addEventListener('click', () => {
                clickCount = 0;
                languageSelect.value = 'en';
                greeting.textContent = `${greetings.en.text} ✨`;
                greeting.lang = 'en';
                greeting.dir = greetings.en.direction;
                languageLabel.textContent = greetings.en.name;
                messageBox.textContent = "準備就緒，隨時可以探索。";
                messageBox.classList.remove('text-indigo-600', 'dark:text-indigo-400', 'font-semibold');
                messageBox.classList.add('text-slate-400');
                resetBtn.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
